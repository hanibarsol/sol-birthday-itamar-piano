<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>ניסוי קצב — המשפחה של סול - תרגול עם שמע</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root {
            --white-w: 50px; --black-w: 25px;
            --modern-hi: #454b54; --modern-lo: #1b1e23; --teal: #6fd6c9; --gold: #e0a83f;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none !important;
            -webkit-touch-callout: none;
            font-family: Arial, sans-serif;
        }
        #app { display: flex; flex-direction: column; width: 100%; height: 100%; }

        /* Invisible full-screen tap catcher, not a visible "click to start"
           prompt — browsers (iOS Safari especially) still require a real
           user gesture before audio can play at all, so this stays in the
           DOM to guarantee that first tap is captured, it just no longer
           looks like a separate screen the child has to get past. */
        #start-screen { position: fixed; inset: 0; background: transparent; z-index: 100; cursor: pointer; }

        /* Pilot: a way back to Sol's home portal, always reachable — sits
           above even the start-screen tap-catcher (higher z-index) so a
           child/parent can leave immediately without first having to "start"
           the lesson. Fixed to the viewport, not the layout, so it never
           competes with the piano for width. */
        #home-btn {
            position: fixed;
            right: 12px;
            top: 38%;
            transform: translateY(-50%);
            z-index: 101;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            touch-action: manipulation;
        }

        /* "אני רוצה לנסות לבד" — an alternate, self-paced view: instead of
           notes falling with the video/audio driving the timing, every note
           in the song sits laid out left-to-right on a music staff, at its
           real pitch height, and the child works through them at their own
           pace with no clock pushing them forward. */
        #solo-btn {
            touch-action: manipulation;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 20px;
            padding: 9px 20px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            background: #262626;
            color: #fff;
            cursor: pointer;
            white-space: nowrap;
        }
        #solo-btn.active { background: var(--teal); color: #0a1210; border-color: var(--teal); font-weight: bold; }

        /* "ככה השיר נשמע" — a short reference clip of Hani playing+singing
           the taught segment, so a child who's pressing the right notes but
           can't recognize the tune in them has somewhere to actually hear it,
           in the scale she played it in. Plays start-to-finish on its own —
           never layered under the child's own playing — so the piano goes
           inert for that moment instead of inviting a confusing double-take. */
        #melody-btn {
            touch-action: manipulation;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 20px;
            padding: 9px 20px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            background: #262626;
            color: #fff;
            cursor: pointer;
            white-space: nowrap;
        }
        #melody-btn.playing { background: var(--gold); color: #2a1c00; border-color: var(--gold); font-weight: bold; }
        .piano.melody-playing { pointer-events: none; opacity: 0.55; }
        #staff-wrap {
            position: relative;
            /* Tied to the piano's own width (7 white keys) — without this,
               #cabinet's width:fit-content let the staff's full, unclipped
               content (however many notes long) stretch the whole cabinet
               to match it instead of scrolling inside a bounded box, which
               on a narrow phone blew the piano itself far past the keys'
               own real, already-correct width. */
            width: calc(var(--white-w) * 7);
            height: var(--staff-h, 150px);
            overflow-x: auto;
            overflow-y: hidden;
            border-radius: 8px 8px 0 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.32));
            margin-bottom: 6px;
            display: none;
        }
        #staff-wrap.active { display: block; }
        #staff-inner { position: relative; height: 100%; }
        .staff-line {
            position: absolute;
            left: 0; right: 0;
            height: 2px;
            background: rgba(255,255,255,0.32);
        }
        .staff-ledger {
            position: absolute;
            height: 2px;
            background: rgba(255,255,255,0.32);
            transform: translate(-50%, -50%);
        }
        .staff-note {
            position: absolute;
            transform: translate(-50%, -50%);
        }
        .staff-note-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(0,0,0,0.85);
            background: #333;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5), 0 0 10px 2px rgba(255,255,255,0.55);
        }
        .staff-note-avatar img { width: 100%; height: 100%; object-fit: contain; display: block; }
        /* Already played correctly — lights up teal and stays lit, so the
           child can see their progress through the whole line at a glance.
           No "play this next" hint on purpose — the point of this mode is
           reading the staff independently, not being told what's next. */
        .staff-note.done .staff-note-avatar {
            border-color: var(--teal);
            box-shadow: 0 0 12px 4px rgba(111,214,201,0.9);
        }

        #speed-bar {
            flex: 0 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            background: #1a1a1a;
            touch-action: manipulation;
        }
        .speed-step-btn {
            touch-action: manipulation;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            font-family: Arial, sans-serif;
            background: #333;
            color: #fff;
            cursor: pointer;
        }
        .speed-step-btn:active { background: #555; }
        #play-pause {
            width: 54px;
            height: 54px;
            font-size: 26px;
        }
        #speed-reset {
            touch-action: manipulation;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            background: #333;
            color: #fff;
            cursor: pointer;
            min-width: 90px;
        }
        #speed-reset.is-normal { background: #ffeb3b; color: #000; font-weight: bold; }

        #piano-container {
            flex: 1 1 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 1.5vh 0;
            box-sizing: border-box;
            touch-action: none !important;
            min-height: 0;
        }
        #rig {
            display: grid;
            grid-template-columns: auto;
            align-items: end;
            justify-content: center;
            gap: 16px;
            width: 100%;
            overflow-x: auto;
            padding: 0 8px;
        }
        #cabinet {
            flex-shrink: 0;
            width: fit-content;
            display: flex; flex-direction: column;
            background: linear-gradient(180deg, var(--modern-hi) 0%, var(--modern-lo) 100%);
            border-radius: 14px;
            padding: 12px 12px 0;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 10px 26px rgba(0,0,0,0.45);
        }
        #cabinet-lip {
            flex: 0 0 auto;
            height: 4px; border-radius: 3px; margin-bottom: 10px;
            background: linear-gradient(90deg, var(--teal), #bdf2ea, var(--teal));
            box-shadow: 0 0 6px rgba(111,214,201,0.6);
        }
        #keywell {
            position: relative;
            background: linear-gradient(180deg, #100f13 0%, var(--modern-lo) 100%);
            border-radius: 10px 10px 0 0;
            padding: 10px 10px 0;
            display: flex; flex-direction: column; align-items: stretch;
        }
        /* ההוראה ישבה בראש הארון - בדיוק במקום ששורת הקצב תפסה, והסתירה
           אותה. היא עוברת לשטח השחור הריק שמעל הארון, מתחת לכפתור הבית
           כדי שלא תשב מתחתיו, ושם היא לא מכסה כלום. */
        #practice-hint {
            position: fixed;
            top: 72px; left: 0; right: 0;
            width: fit-content;
            margin: 0 auto;
            max-width: calc(100% - 24px);
            box-sizing: border-box;
            text-align: center;
            background: rgba(0,0,0,0.8);
            border: 1px solid rgba(111,214,201,0.4);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 16px;
            white-space: normal;
            z-index: 60;
            opacity: 1;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        #practice-hint.hidden { opacity: 0; }
        #note-lane {
            position: relative;
            height: var(--lane-h, 0px);
            display: flex;
            overflow: hidden;
            border-radius: 8px 8px 0 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.32));
            margin-bottom: 6px;
            transition: height 0.2s ease;
        }
        #note-lane.hidden { height: 0 !important; margin-bottom: 0; }
        .note-lane-col {
            position: relative;
            width: var(--white-w);
            height: 100%;
            border-right: 1px solid rgba(255,255,255,0.05);
        }
        .note-lane-col:last-child { border-right: none; }
        #note-lane-hitline {
            position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
            border-radius: 2px;
            background: linear-gradient(90deg, #29c98f, #baf7d9, #29c98f);
            box-shadow: 0 0 9px rgba(41,201,143,0.8), inset 0 0 2px rgba(255,255,255,0.6);
        }
        .falling-note {
            position: absolute;
            top: 0;
            left: 50%;
            width: calc(var(--white-w) * 0.48);
            height: calc(var(--white-w) * 0.48);
            transform: translateX(-50%);
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(0,0,0,0.85);
            box-shadow: 0 2px 6px rgba(0,0,0,0.5), 0 0 10px 2px rgba(255,255,255,0.65);
            background: #333;
            pointer-events: none;
        }
        .falling-note img { width: 100%; height: 100%; object-fit: contain; display: block; }
        @keyframes bubble-pop {
            0%   { transform: translateX(-50%) scale(1); opacity: 1; }
            30%  { transform: translateX(-50%) scale(0.85); opacity: 1; }
            100% { transform: translateX(-50%) scale(2.1); opacity: 0; }
        }
        .falling-note.hit { animation: bubble-pop 0.3s ease-out forwards; }

        .piano {
            align-self: center;
            display: flex;
            position: relative;
            direction: ltr;
            height: var(--key-h, 220px);
            touch-action: none !important;
        }

        .key {
            position: relative;
            border: 1px solid #000;
            box-sizing: border-box;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 6px;
            z-index: 10;
            touch-action: none !important;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .white-key { width: var(--white-w); height: 100%; background-color: white; border-radius: 0 0 5px 5px; }

        .key-fill {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 0%;
            z-index: -1;
            pointer-events: none;
            border-radius: 0 0 5px 5px;
            background: linear-gradient(180deg, rgba(130,226,255,0.4), rgba(41,150,201,0.75));
            transition: height 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .key-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: rgba(255,255,255,0.85);
            box-shadow: 0 0 6px rgba(255,255,255,0.85);
            transform-origin: 50% 50%;
        }
        .key-fill.pouring::after {
            animation: water-sway 0.9s ease-out 1;
        }
        @keyframes water-sway {
            0%   { transform: rotate(0deg) translateY(0); }
            20%  { transform: rotate(-6deg) translateY(0); }
            45%  { transform: rotate(4deg) translateY(-2px); }
            70%  { transform: rotate(-2deg) translateY(0); }
            100% { transform: rotate(0deg) translateY(0); }
        }
        @media (prefers-reduced-motion: reduce) {
            .key-fill.pouring::after { animation: none; }
        }

        .black-key {
            width: var(--black-w);
            height: 45%;
            background-color: #333;
            z-index: 30;
            margin-left: calc(var(--black-w) / -2);
            margin-right: calc(var(--black-w) / -2);
            border-radius: 0 0 3px 3px;
        }

        .key.active { background-color: #ffeb3b !important; }
        .key.due { box-shadow: inset 0 0 0 5px #4caf50; }
        .key.correct-flash {
            background-color: #ffab00 !important;
            box-shadow: 0 0 10px 2px rgba(255, 171, 0, 0.45);
            transition: background-color 0.25s ease-out, box-shadow 0.25s ease-out;
        }
        @keyframes star-pop {
            0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
            40%  { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.7); opacity: 0; }
        }
        .star-pop {
            position: absolute;
            top: 35%;
            left: 50%;
            font-size: 28px;
            pointer-events: none;
            animation: star-pop 0.55s ease-out forwards;
            z-index: 41;
        }

        .character-img {
            width: 80%;
            margin-bottom: 4px;
            pointer-events: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        #calib-panel {
            display: none;
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 200;
            background: rgba(0,0,0,0.75);
            border-radius: 10px;
            padding: 8px;
            max-width: 220px;
            touch-action: manipulation;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        #calib-panel button {
            touch-action: manipulation;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            margin: 2px;
        }
        #calib-mark { background: #ffeb3b; color: #000; font-weight: bold; width: 100%; padding: 12px; font-size: 16px; }
        #calib-undo { background: #555; color: #fff; }
        #calib-clear { background: #555; color: #fff; }
        #calib-copy { background: #4caf50; color: #fff; }
        #calib-list {
            touch-action: manipulation;
            max-height: 110px;
            overflow-y: auto;
            font-size: 12px;
            margin-top: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 6px;
            padding: 4px;
            direction: ltr;
            text-align: left;
        }
        #calib-copy-box {
            display: none;
            touch-action: manipulation;
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            font-size: 12px;
            direction: ltr;
            text-align: left;
            resize: none;
            border-radius: 6px;
            border: 1px solid #4caf50;
            padding: 4px;
        }

        /* ================= ניסוי קצב — תוספת זמנית =================
           קובץ ניסוי בלבד. index.html לא מושפע ממנו בשום צורה.
           הרעיון: תו ארוך צריך החזקה, לא נגיעה. העיגול של הדמות
           מתמלא מים כל עוד האצבע למטה, וכשהוא מלא נשמע צלצול.
           שחרור מוקדם אינו טעות — המים נשפכים חזרה ואפשר לנסות שוב. */

        /* הסרגל העליון יוצא מהניסוי: כאן יש רק "אני רוצה לנסות לבד",
           והמקום שהוא מפנה הולך לשורת הקצב — לא מקטינים את התווים. */
        #speed-bar { display: none !important; }

        .staff-note-avatar { position: relative; }
        .note-water { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
        .note-water svg { width: 100%; height: 100%; display: block; }

        /* בזמן החזקה — טבעת זהב. שום דבר לא גדל ולא זז: האצבע עדיין על
           העיגול, ותנועה מתחתיה נראית כאילו הוא מתנפח ובורח. */
        .staff-note.holding .staff-note-avatar {
            border-color: var(--gold);
            box-shadow: 0 2px 6px rgba(0,0,0,0.5), 0 0 0 4px rgba(255,214,102,0.5);
        }
        .staff-note.hold-full .staff-note-avatar {
            border-color: var(--teal);
            box-shadow: 0 0 0 7px rgba(111,214,201,0.45), 0 0 14px 4px rgba(111,214,201,0.9);
        }

        /* אפשר לנגן מהעיגול עצמו, ולא רק מהקליד */
        .staff-note { cursor: pointer; }
        .staff-note .staff-note-avatar { border-width: 3px; }

        /* אצבע שנחה על עיגול: iOS מנסה לגרור אותו כתמונה, לפתוח תפריט
           לחיצה ארוכה ולסמן טקסט — הכתם הכחול וזכוכית המגדלת שצפה מעליו. */
        .staff-note, .staff-note *, .key, .key *, #rhythm-lane, #rhythm-lane * {
            -webkit-user-drag: none; user-drag: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none; user-select: none;
        }
        .staff-note img, .staff-note svg, .rhythm-dot svg { pointer-events: none; }
        /* ההגדלה חזרה כי touch-action ב-CSS לא עוברת בירושה: היא הייתה
           רשומה על body בלבד, אז הקלידים היו מוגנים אבל הרקע השחור,
           ארון הפסנתר ואזור החמשה נשארו פתוחים להקשה כפולה. */
        /* ב-WebKit הערך שמכבה הקשה-כפולה-להגדלה הוא manipulation בלבד.
           none נשמע חזק יותר - הוא חוסם גלילה, זום, הכל - אבל דווקא את
           ההקשה הכפולה הוא לא מכבה באמינות. ההחלפה ל-none נעשתה כאן היום
           מתוך כוונה לחזק, וכנראה החזירה בדיוק את מה שניסתה לחסום.
           הצביטה ממילא נחסמת בקוד ולא ב-CSS, אז אין מה להפסיד. */
        html, body, #app, #app *, #start-screen, .sol-home-btn,
        .key, .piano, #piano-container { touch-action: manipulation !important; }
        /* שורת אבחון זמנית — יורדת ברגע שנדע מה גורם להגדלה */
        /* ממוקם מהקוד לפי החלון הנראה, לא לפי תחתית העמוד: כשספארי
           מגדיל, תחתית העמוד יוצאת מהמסך והפס נעלם בדיוק כשצריך אותו. */
        #dbg-bar {
            position: fixed; left: 0; top: 0; z-index: 9999;
            background: rgba(255,255,255,0.95); color: #000;
            font: 11px/1.4 monospace; direction: ltr; text-align: left;
            padding: 5px 7px; white-space: pre-wrap; pointer-events: none;
            border-top: 2px solid #000;
        }
        #dbg-big { display: block; font-size: 17px; font-weight: bold; letter-spacing: 0.5px; }
        #dbg-verdict { display: block; font-size: 19px; font-weight: bold; direction: rtl; text-align: right; padding: 2px 0; }
        #dbg-verdict.bad { color: #b00020; }
        #dbg-trigger { display: block; font-size: 14px; font-weight: bold; color: #0043b0; }
        /* ================= סוף תוספת הניסוי ================= */
    </style>
<style>
/* ---------- Sol home button (unified turquoise) ---------- */
.sol-home-btn {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 101;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #17A79B;
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(18, 48, 44, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.sol-home-btn:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 8px 18px rgba(18, 48, 44, 0.45); }
.sol-home-btn:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 3px; }
.sol-home-btn svg { width: 26px; height: 26px; }
@media (max-width: 640px) {
    .sol-home-btn { width: 44px; height: 44px; top: 8px; left: 8px; }
    .sol-home-btn svg { width: 22px; height: 22px; }
}
@media (prefers-reduced-motion: reduce) {
    .sol-home-btn { transition: none; }
    .sol-home-btn:hover { transform: none; }
}

/* On a narrow phone the fixed home button reaches into this row — reserve
   its corner rather than shrinking any control. */
@media (max-width: 420px) { #speed-bar { padding-left: 62px; } }
</style>
</head>
<body>

<div id="app">
    <!-- Audio-only lesson, hosted permanently — no visible video, black
         background throughout, only the piano/lane/characters. -->
    <video id="song-audio" src="song.mp4" style="display:none" playsinline muted></video>
    <audio id="melody-audio" src="melody.mp3" preload="none"></audio>
    <div id="speed-bar">
        <button id="play-pause" class="speed-step-btn">▶</button>
        <button id="speed-minus" class="speed-step-btn">－</button>
        <button id="speed-reset" class="is-normal">מהירות</button>
        <button id="speed-plus" class="speed-step-btn">＋</button>
        <button id="melody-btn">🎵 ככה השיר נשמע</button>
        <button id="solo-btn">אני רוצה לנסות לבד</button>
    </div>
    <div id="piano-container">
        <div id="rig">
            <div id="cabinet">
                <div id="cabinet-lip"></div>
                <div id="keywell">
                    <div id="note-lane"></div>
                    <div id="staff-wrap"><div id="staff-inner"></div></div>
                    <div class="piano" id="piano"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="practice-hint" class="hidden">לחצו על הקליד כשהדמות מגיעה לקו 👇</div>

<div id="start-screen"></div>

<a class="sol-home-btn" href="https://portal.smoove.io/gsbmtbnbbf1yd87kbofd1/Category?category=qqb" target="_top" aria-label="חזרה למסך הבית">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 11l9-8 9 8" />
        <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10" />
    </svg>
</a>

<div id="calib-panel">
    <button id="calib-mark">סמן עכשיו ▶</button>
    <div style="display:flex; justify-content:space-between;">
        <button id="calib-undo">בטל אחרון</button>
        <button id="calib-clear">נקה הכל</button>
    </div>
    <button id="calib-copy" style="width:100%">העתק תוצאות</button>
    <textarea id="calib-copy-box" readonly rows="3"></textarea>
    <div id="calib-list"></div>
</div>

<script>
    // iOS Safari ignores user-scalable=no, so a stray pinch — or a quick
    // double-tap near the top-bar buttons — zoomed the page in with no way
    // back that a 4-8 year old would find. This is a fixed, full-screen
    // instrument; nothing here is meant to be zoomed or panned, so the
    // zoom gestures are refused outright.
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(evt => {
        document.addEventListener(evt, e => e.preventDefault(), { passive: false });
    });
    document.addEventListener('touchmove', e => {
        if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    // הצביטה היא מחווה של המערכת, ו-touch-action לא שולט בה באייפון.
    // הדרך היחידה שנשארה היא לתפוס את המגע השני לפני שספארי מפרש אותו.
    // כאן מנגנים תו אחד בכל רגע, ולכן אין מה לאבד - אבל בנגינה חופשית
    // בשתי ידיים זה כן היה עולה במחיר.
    document.addEventListener('touchstart', e => {
        if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    // הקשה כפולה: ספארי מגדיל כדי "להתאים" אלמנט למסך, תמיד לאותה מידה
    // בדיוק - וזה מסביר למה חזר אותו 1.60 פעמיים. touch-action אמור היה
    // לחסום את זה ולא חסם, אז חוסמים את הנגיעה השנייה עצמה. הקלידים
    // עובדים על pointerdown ולכן הנגינה לא מושפעת.
    let lastTapEnd = 0;
    document.addEventListener('touchend', e => {
        const now = Date.now();
        if (now - lastTapEnd <= 350) e.preventDefault();
        lastTapEnd = now;
    }, { passive: false });

    const startScreen = document.getElementById('start-screen');
    const pianoElement = document.getElementById('piano');
    const pianoContainer = document.getElementById('piano-container');
    const noteLane = document.getElementById('note-lane');
    const practiceHint = document.getElementById('practice-hint');
    let hintTimeout = null;
    function showPracticeHint() {
        practiceHint.classList.remove('hidden');
        clearTimeout(hintTimeout);
        hintTimeout = setTimeout(() => practiceHint.classList.add('hidden'), 4500);
    }
    function dismissPracticeHint() {
        practiceHint.classList.add('hidden');
        clearTimeout(hintTimeout);
    }

    // Calibration tool is dev-only: hidden from students, shown only when
    // building/checking a song's timing map via ?admin=1 in the URL.
    if (new URLSearchParams(location.search).get('admin') === '1') {
        document.getElementById('calib-panel').style.display = 'block';
    }

    // No video here — a hidden <video> element (hosted file, not a picker)
    // takes the YouTube player's place, wrapped in the same shape so the
    // rest of the page's logic doesn't need to know the difference.
    const audioEl = document.getElementById('song-audio');
    const PlayerState = { ENDED: 0, PLAYING: 1, PAUSED: 2 };
    const YT = { PlayerState: PlayerState };
    const player = {
        getCurrentTime: () => audioEl.currentTime || 0,
        getDuration: () => audioEl.duration || 0,
        playVideo: () => { audioEl.play().catch(() => {}); },
        pauseVideo: () => audioEl.pause(),
        seekTo: (t) => { audioEl.currentTime = t; },
        setPlaybackRate: (r) => { audioEl.playbackRate = r; },
        getPlayerState: () => audioEl.ended ? PlayerState.ENDED : (audioEl.paused ? PlayerState.PAUSED : PlayerState.PLAYING),
    };

    startScreen.addEventListener('click', async () => {
        await Tone.start();
        await reverb.ready;
        startScreen.style.display = 'none';
        // המסך כבר במצב "לנסות לבד" מרגע הטעינה. הנגיעה הזו רק משחררת
        // את השמע, ולכן שום דבר על המסך לא זז מתחת לאצבע.
        showPracticeHint();
    });

    // Speed stepper: minus/plus move between steps. 0.7x (30% slower) is
    // the starting/"normal" speed here instead of 1x — the ×/－ buttons
    // still work the same way around that new baseline.
    const speedSteps = [0.4, 0.55, 0.7, 0.85, 1];
    let speedIndex = 2; // 0.7x, the default
    const speedMinusBtn = document.getElementById('speed-minus');
    const speedPlusBtn = document.getElementById('speed-plus');
    const speedResetBtn = document.getElementById('speed-reset');

    function applySpeed(index) {
        speedIndex = Math.max(0, Math.min(speedSteps.length - 1, index));
        const rate = speedSteps[speedIndex];
        player.setPlaybackRate(rate);
        const isNormal = rate === 0.7;
        speedResetBtn.textContent = isNormal ? 'מהירות' : `×${rate}`;
        speedResetBtn.classList.toggle('is-normal', isNormal);
    }

    speedMinusBtn.addEventListener('click', () => applySpeed(speedIndex - 1));
    speedPlusBtn.addEventListener('click', () => applySpeed(speedIndex + 1));
    speedResetBtn.addEventListener('click', () => applySpeed(2));
    // Apply the default rate right away — earlier pages never needed this
    // because 1x already matched the <video>/YouTube element's own default.
    applySpeed(speedIndex);

    // Pause/resume — becomes "play again" once the song ends.
    const playPauseBtn = document.getElementById('play-pause');
    let isPaused = false;
    playPauseBtn.addEventListener('click', () => {
        if (player.getPlayerState() === YT.PlayerState.ENDED) {
            player.seekTo(0);
            player.playVideo();
            songIdx = 0;
            songHit = false;
            resetKeyFills();
            isPaused = false;
            playPauseBtn.textContent = '⏸';
            return;
        }
        isPaused = !isPaused;
        if (isPaused) { player.pauseVideo(); playPauseBtn.textContent = '▶'; }
        else { player.playVideo(); playPauseBtn.textContent = '⏸'; }
    });
    audioEl.addEventListener('ended', () => {
        if (audioEl.currentTime < 0.5) return;
        isPaused = true;
        playPauseBtn.textContent = '🔁';
    });

    // "ככה השיר נשמע" — plays start-to-finish on its own, never mixed with
    // the child's own playing, so the piano goes inert for that moment.
    const melodyBtn = document.getElementById('melody-btn');
    const melodyAudio = document.getElementById('melody-audio');
    melodyBtn.addEventListener('click', () => {
        if (melodyBtn.classList.contains('playing')) {
            // Tapping again mid-playback stops it early — nothing here
            // should force a full, uninterruptible listen.
            melodyAudio.pause();
            melodyBtn.classList.remove('playing');
            melodyBtn.textContent = '🎵 ככה השיר נשמע';
            pianoElement.classList.remove('melody-playing');
            return;
        }
        melodyBtn.classList.add('playing');
        melodyBtn.textContent = '⏹ עצירה';
        pianoElement.classList.add('melody-playing');
        player.pauseVideo();
        isPaused = true;
        playPauseBtn.textContent = '▶';
        melodyAudio.currentTime = 0;
        melodyAudio.play();
    });
    melodyAudio.addEventListener('ended', () => {
        melodyBtn.classList.remove('playing');
        melodyBtn.textContent = '🎵 ככה השיר נשמע';
        pianoElement.classList.remove('melody-playing');
    });

    // --- Calibration tool: tap "mark now" every time a character hits the
    // beat, and it logs the exact audio timestamp.
    const calibMarks = [];
    const calibListEl = document.getElementById('calib-list');
    const calibMarkBtn = document.getElementById('calib-mark');
    const calibUndoBtn = document.getElementById('calib-undo');
    const calibClearBtn = document.getElementById('calib-clear');
    const calibCopyBtn = document.getElementById('calib-copy');

    function renderCalibList() {
        calibListEl.innerHTML = calibMarks
            .map((t, i) => `${i + 1}. ${t.toFixed(2)}s`)
            .join('<br>');
        calibListEl.scrollTop = calibListEl.scrollHeight;
    }

    calibMarkBtn.addEventListener('click', () => {
        calibMarks.push(player.getCurrentTime());
        renderCalibList();
    });
    calibUndoBtn.addEventListener('click', () => { calibMarks.pop(); renderCalibList(); });
    calibClearBtn.addEventListener('click', () => { calibMarks.length = 0; renderCalibList(); });
    const calibCopyBox = document.getElementById('calib-copy-box');
    calibCopyBtn.addEventListener('click', () => {
        const text = calibMarks.map(t => t.toFixed(2)).join(', ');
        calibCopyBox.value = text;
        calibCopyBox.style.display = 'block';
        calibCopyBox.focus();
        calibCopyBox.select();
        navigator.clipboard.writeText(text).then(() => {
            calibCopyBtn.textContent = 'הועתק! (או בחרי ידנית למטה)';
        }).catch(() => {
            calibCopyBtn.textContent = 'בחרי את הטקסט למטה ותעתיקי ידנית';
        });
        setTimeout(() => { calibCopyBtn.textContent = 'העתק תוצאות'; }, 2500);
    });

    // Calibrated from Hani's marks for "היום יום הולדת לאיתמר".
    const songTimes = [1.28, 2.14, 2.71, 3.21, 4.30, 4.95, 5.52, 6.60, 7.16, 7.67, 8.67, 9.28, 9.79, 10.91, 11.51, 12.04, 12.57, 13.10, 13.65, 14.18, 15.28, 16.36, 18.55, 19.67, 20.21, 20.80, 21.89, 22.48, 23.06, 24.21, 24.78, 25.32, 26.48, 27.02, 27.60, 28.77, 29.32, 29.95, 30.49, 31.09, 31.59, 32.18, 33.39, 34.72];
    const songLetters = ['E', 'E', 'E', 'E', 'D', 'C', 'F', 'F', 'F', 'F', 'E', 'D', 'G', 'G', 'A', 'G', 'F', 'E', 'D', 'E', 'F', 'G', 'E', 'E', 'E', 'E', 'D', 'C', 'F', 'F', 'F', 'F', 'E', 'D', 'G', 'G', 'A', 'G', 'F', 'E', 'D', 'E', 'D', 'C'];
    const songNotes = songTimes.map((t, i) => ({ time: t, note: songLetters[i] + '4' }));

    // --- ניסוי קצב: מאיפה מגיע אורך התו ---
    // הנתונים למעלה הם רק רגעי הכניסה של כל תו, אין בהם אורך. האורך
    // נגזר מהמרווח עד התו הבא. התקרה קיימת בגלל ההפסקה בין הבתים
    // (2.19 שנ' אחרי התו ה-22) — זו שתיקה, לא תו שמחזיקים כפליים.
    const HOLD_MIN = 0.75;  // מתחת לזה: נגיעה. מעל: החזקה.
    const DUR_CAP  = 1.4;   // תקרה לאורך תו
    const LAST_DUR = 1.0;   // לתו האחרון אין מרווח אחריו
    const HOLD_TOL = 0.90;  // 90% מהאורך כבר נחשב מלא
    songNotes.forEach((n, i) => {
        const gap = i < songNotes.length - 1 ? songNotes[i + 1].time - n.time : LAST_DUR;
        n.dur = Math.min(gap, DUR_CAP);
        n.hold = n.dur >= HOLD_MIN;
    });

    const songNoteTotals = {};
    songNotes.forEach(n => { songNoteTotals[n.note] = (songNoteTotals[n.note] || 0) + 1; });
    const songNoteCorrect = {};
    const keyFillEls = {};
    function fillKey(note) {
        const total = songNoteTotals[note];
        const fillEl = keyFillEls[note];
        const keyEl = keyByNote[note];
        if (!total || !fillEl || !keyEl) return;
        songNoteCorrect[note] = (songNoteCorrect[note] || 0) + 1;
        const pct = Math.min(1, songNoteCorrect[note] / total);
        fillEl.style.height = Math.round(pct * keyEl.clientHeight) + 'px';
        fillEl.classList.remove('pouring');
        void fillEl.offsetWidth;
        fillEl.classList.add('pouring');
        clearTimeout(fillEl._pourTimeout);
        fillEl._pourTimeout = setTimeout(() => fillEl.classList.remove('pouring'), 900);
    }

    // Starting the song over should start the results over too — otherwise
    // a key already "full" from the last attempt stays full forever, which
    // stops meaning anything.
    function resetKeyFills() {
        Object.keys(songNoteCorrect).forEach(note => { delete songNoteCorrect[note]; });
        Object.values(keyFillEls).forEach(el => {
            el.classList.remove('pouring');
            el.style.height = '0px';
        });
    }

    const NOTE_LEAD = 0.6;
    const NOTE_TAIL = 0.45;
    let songIdx = 0;
    let songHit = false;
    const keyByNote = {};

    const characterImages = ["דו.png", "רה.png", "מי.png", "פה.png", "סול.png", "לה.png", "סי.png"];

    const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const octaves = [4];

    function noteToFile(note, octave) {
        const letter = note[0].toLowerCase();
        const sharp = note.includes('#') ? 'd' : '';
        return `sounds/${letter}${sharp}${octave}.wav`;
    }

    const knownBadSamples = new Set(['D4', 'E4']);

    const sampleUrls = {};
    octaves.forEach(octave => {
        notes.forEach(note => {
            const fullNote = note + octave;
            if (knownBadSamples.has(fullNote)) return;
            sampleUrls[fullNote] = noteToFile(note, octave);
        });
    });

    const audioCtx = Tone.getContext().rawContext;
    const masterGain = audioCtx.createGain();
    masterGain.gain.value = 1;
    masterGain.connect(audioCtx.destination);

    const reverb = new Tone.Reverb({ decay: 2.5, wet: 0.32 }).connect(masterGain);

    const sampler = new Tone.Sampler({
        urls: sampleUrls,
        baseUrl: "./",
        attack: 0.005,
        release: 2.2,
        onload: () => console.log("Sounds loaded!"),
        onerror: (e) => console.log("Error loading sound", e)
    }).connect(reverb);

    let currentMode = 'piano';

    function noteNameToFreq(name) {
        const idx = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
        const m = name.match(/^([A-G]#?)(\d)$/);
        const midi = (parseInt(m[2], 10) + 1) * 12 + idx[m[1]];
        return 440 * Math.pow(2, (midi - 69) / 12);
    }

    let whiteKeyIndex = 0;

    octaves.forEach(octave => {
        notes.forEach(note => {
            const isBlack = note.includes('#');
            const fullNote = note + octave;
            const freq = noteNameToFreq(fullNote);
            const key = document.createElement('div');
            key.className = `key ${isBlack ? 'black-key' : 'white-key'}`;
            key.dataset.note = fullNote;
            key.dataset.isPlaying = "false";
            keyByNote[fullNote] = key;

            if (songNoteTotals[fullNote]) {
                const fillEl = document.createElement('div');
                fillEl.className = 'key-fill';
                key.appendChild(fillEl);
                keyFillEls[fullNote] = fillEl;
            }

            if (!isBlack) {
                const img = document.createElement('img');
                img.src = characterImages[whiteKeyIndex] || "";
                img.className = 'character-img';
                key.appendChild(img);
                whiteKeyIndex++;
            }

            const playNote = () => {
                if (key.dataset.isPlaying === "true") return;
                key.dataset.isPlaying = "true";
                key.classList.add('active');
                dismissPracticeHint();

                try { sampler.triggerAttack(fullNote); } catch (err) {}

                if (soloMode) {
                    // ניסוי קצב: "נכון" הוא עדיין התו הבא בתור, אבל עכשיו
                    // גם האורך שלו נחשב — תו ארוך נדרש להחזקה, לא לנגיעה.
                    if (soloIdx < songNotes.length && fullNote === songNotes[soloIdx].note) {
                        if (songNotes[soloIdx].hold) startHold(soloIdx, key);
                        else completeSoloNote(soloIdx, key);
                    }
                } else if (!songHit && songIdx < songNotes.length) {
                    const cur = songNotes[songIdx];
                    if (fullNote === cur.note) {
                        const t = player.getCurrentTime();
                        if (t >= cur.time - NOTE_LEAD && t <= cur.time + NOTE_TAIL) {
                            songHit = true;
                            markTileHit(songIdx);
                            fillKey(fullNote);
                            key.classList.add('correct-flash');
                            const star = document.createElement('div');
                            star.className = 'star-pop';
                            star.textContent = '⭐';
                            key.appendChild(star);
                            setTimeout(() => {
                                key.classList.remove('correct-flash');
                                star.remove();
                            }, 550);
                        }
                    }
                }
            };

            const stopNote = () => {
                if (key.dataset.isPlaying === "false") return;
                key.dataset.isPlaying = "false";
                key.classList.remove('active');
                releaseHold(key);
                try { sampler.triggerRelease(fullNote); } catch (err) {}
            };

            let isTouchActive = false;

            key.addEventListener('pointerdown', () => {
                if (isTouchActive) return;
                isTouchActive = true;
                playNote();
            });
            key.addEventListener('pointermove', (e) => e.preventDefault());
            key.addEventListener('pointerup', () => { isTouchActive = false; stopNote(); });
            key.addEventListener('pointerleave', () => { isTouchActive = false; stopNote(); });
            key.addEventListener('pointercancel', () => { isTouchActive = false; stopNote(); });

            pianoElement.appendChild(key);
        });
    });

    const noteLetterOrder = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
    const laneCols = {};
    noteLetterOrder.forEach((letter) => {
        const col = document.createElement('div');
        col.className = 'note-lane-col';
        laneCols[letter] = col;
        noteLane.appendChild(col);
    });
    const hitLine = document.createElement('div');
    hitLine.id = 'note-lane-hitline';
    noteLane.appendChild(hitLine);

    // This song also has runs of 4 repeated same-letter notes only ~0.5-0.6s
    // apart (e.g. the opening מי-מי-מי-מי) — the same pattern that caused
    // overlapping falling tiles in byshema, so the same shorter lookahead
    // and smaller tile size are applied here from the start rather than
    // waiting to hit the same bug.
    const FALL_DURATION = 1.3;
    const activeTiles = new Map();

    function renderFallingLane(t) {
        if (soloMode) return;
        const laneH = noteLane.clientHeight;
        if (!laneH) return;
        const whiteWpx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--white-w')) || 0;
        const tileSize = whiteWpx * 0.48;
        const landTop = Math.max(0, laneH - tileSize);
        const progressCutoff = 1 + (NOTE_TAIL + 0.3) / FALL_DURATION;
        songNotes.forEach((n, i) => {
            const letter = n.note[0];
            const col = laneCols[letter];
            if (!col) return;
            const timeUntil = n.time - t;
            const visible = timeUntil <= FALL_DURATION && timeUntil >= -(NOTE_TAIL + 0.3);
            let tile = activeTiles.get(i);
            if (visible) {
                if (!tile) {
                    tile = document.createElement('div');
                    tile.className = 'falling-note';
                    const img = document.createElement('img');
                    img.src = characterImages[noteLetterOrder.indexOf(letter)] || '';
                    tile.appendChild(img);
                    col.appendChild(tile);
                    activeTiles.set(i, tile);
                }
                if (!tile.classList.contains('hit')) {
                    const progress = Math.max(0, 1 - timeUntil / FALL_DURATION);
                    tile.style.top = (progress * landTop) + 'px';
                    if (progress > 1) {
                        const fade = Math.min(1, (progress - 1) / (progressCutoff - 1));
                        tile.style.opacity = String(Math.max(0, 1 - fade));
                    }
                }
            } else if (tile) {
                tile.remove();
                activeTiles.delete(i);
            }
        });
    }

    function markTileHit(index) {
        const tile = activeTiles.get(index);
        if (!tile) return;
        tile.classList.add('hit');
        activeTiles.delete(index);
        setTimeout(() => tile.remove(), 300);
    }

    // --- "אני רוצה לנסות לבד" — self-paced staff view. Every note in the
    // song is laid out once, left to right in order, at its real pitch
    // height on a 5-line staff (do sits on a ledger line below the staff,
    // same as real sheet music). No falling animation, no audio timing —
    // the child just works through the sequence at their own pace, and a
    // green ring shows which note comes next.
    let soloMode = false;
    let soloIdx = 0;
    const soloBtn = document.getElementById('solo-btn');
    const staffWrap = document.getElementById('staff-wrap');
    const staffInner = document.getElementById('staff-inner');
    const staffNoteEls = [];

    // Vertical position (px from the top staff line) for each natural
    // letter in treble clef, single octave from C4. Sharps reuse their
    // neighboring natural's height — same convention as the falling-note
    // lane and the physical black keys.
    // מצב "לנסות לבד" ויתר על החמשה ועל גובה התווים בכוונה: ברגע שתו
    // צריך לשבת בגובה שמייצג את הצליל, כל טווח הצלילים אוכל את הגובה
    // ולדמות עצמה נשאר שליש ממנו - 25 פיקסלים, שילד בן 4 לא רואה.
    // בשורה אחת הדמות מקבלת כמעט את כל הגובה, וגם אפשר ללחוץ עליה.
    // מצב התרגול הרגיל לא הושפע ועדיין עובד על מסלול התווים הנופלים.
    const NOTE_HOLD_D = 90;  // תו שמחזיקים
    const NOTE_TAP_D  = 70;  // תו של נגיעה
    const staffWaterEls = [];

    const WAVE_TOP  = "M-100,0 q25,-6 50,0 t50,0 t50,0 t50,0 t50,0 t50,0";
    const WAVE_PATH = WAVE_TOP + " V115 H-100 Z";
    function waterSvg(opacity) {
        return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +
            '<path class="wv" fill="#0F8C82" fill-opacity="' + opacity + '" d="' + WAVE_PATH + '" transform="translate(0,100)"></path>' +
            '<path class="wv" fill="none" stroke="#BFF6EE" stroke-width="6" stroke-opacity="0.95" d="' + WAVE_TOP + '" transform="translate(0,100)"></path>' +
            '</svg>';
    }
    function setWater(el, p) {
        if (!el) return;
        // הגל מתנדנד קלות בזמן שהוא עולה, כדי שייראה כמו מים ולא כמו פס
        const t = 'translate(' + (Math.sin(Date.now() / 240) * 6) + ',' + ((1 - p) * 100) + ')';
        el.querySelectorAll('.wv').forEach(wv => wv.setAttribute('transform', t));
    }
    function paintNoteFill(idx, p) {
        setWater(staffWaterEls[idx], p);
    }

    function buildStaff() {
        staffInner.innerHTML = '';
        staffNoteEls.length = 0;
        staffWaterEls.length = 0;
        const wrapH = staffWrap.clientHeight || 116;
        const wrapW = staffWrap.clientWidth || 320;
        // 90 הוא הגודל שנבחר, אבל לא על חשבון שני דברים: שהעיגול ייכנס
        // בגובה הרצועה, ושתמיד יישארו כמה תווים קדימה על המסך.
        const scale = Math.min(1, (wrapH - 14) / NOTE_HOLD_D, (wrapW * 0.34) / NOTE_HOLD_D);
        const spacing = NOTE_HOLD_D * scale * 1.35;
        staffInner.style.width = (songNotes.length * spacing + spacing) + 'px';
        songNotes.forEach((n, i) => {
            const d = Math.round((n.hold ? NOTE_HOLD_D : NOTE_TAP_D) * scale);
            const note = document.createElement('div');
            note.className = 'staff-note' + (n.hold ? ' is-hold' : ' is-tap');
            if (i < soloIdx) note.classList.add('done');
            note.style.left = (spacing * 0.6 + i * spacing) + 'px';
            note.style.top = (wrapH / 2) + 'px';
            note.style.width = d + 'px';
            note.style.height = d + 'px';
            const avatar = document.createElement('div');
            avatar.className = 'staff-note-avatar';
            const img = document.createElement('img');
            img.src = characterImages[noteLetterOrder.indexOf(n.note[0])] || '';
            img.draggable = false;
            avatar.appendChild(img);
            const water = document.createElement('div');
            water.className = 'note-water';
            water.innerHTML = waterSvg('0.72');
            avatar.appendChild(water);
            staffWaterEls.push(water);
            note.appendChild(avatar);
            // אפשר לנגן מכאן או מהקליד, לבחירת התלמיד.
            note.addEventListener('pointerdown', (e) => { e.preventDefault(); circleDown(i, note); });
            ['pointerup', 'pointerleave', 'pointercancel'].forEach(t =>
                note.addEventListener(t, () => circleUp(i, note)));
            staffInner.appendChild(note);
            staffNoteEls.push(note);
            if (i < soloIdx) paintNoteFill(i, 1);
        });
        updateStaffScroll();
    }

    // נגינה מהעיגול עצמו. רק התו שבתור מגיב; נגיעה באחרים לא עושה כלום
    // ואינה נספרת כטעות, בדיוק כמו קליד לא נכון במצב הזה.
    function circleDown(idx, el) {
        if (!soloMode || soloHold || idx !== soloIdx) return;
        const n = songNotes[idx];
        const keyEl = keyByNote[n.note];
        if (keyEl) keyEl.classList.add('active');
        dismissPracticeHint();
        try { sampler.triggerAttack(n.note); } catch (err) {}
        if (n.hold) startHold(idx, el);
        else completeSoloNote(idx, el);
    }
    function circleUp(idx, el) {
        const n = songNotes[idx];
        if (!n) return;
        try { sampler.triggerRelease(n.note); } catch (err) {}
        const keyEl = keyByNote[n.note];
        if (keyEl) keyEl.classList.remove('active');
        releaseHold(el);
    }

    // --- ניסוי קצב: החזקת תו ---
    let soloHold = null;
    let drainSeq = 0;
    let chimeSynth = null;

    function holdChime() {
        try {
            if (!chimeSynth) {
                chimeSynth = new Tone.Synth({
                    oscillator: { type: 'sine' },
                    envelope: { attack: 0.005, decay: 0.4, sustain: 0, release: 0.1 }
                }).toDestination();
                chimeSynth.volume.value = -14;
            }
            chimeSynth.triggerAttackRelease('C7', 0.25);
        } catch (err) {}
    }

    // הקליד מהבהב תמיד, גם כשניגנו מהעיגול, כדי שהקשר בין הדמות לקליד
    // יישאר גלוי. הכוכב מופיע על מה שנלחץ בפועל.
    function completeSoloNote(idx, pressedEl) {
        const n = songNotes[idx];
        const keyEl = keyByNote[n.note];
        fillKey(n.note);
        if (keyEl) {
            keyEl.classList.add('correct-flash');
            setTimeout(() => keyEl.classList.remove('correct-flash'), 550);
        }
        const host = pressedEl || keyEl;
        if (host) {
            const star = document.createElement('div');
            star.className = 'star-pop';
            star.textContent = '⭐';
            host.appendChild(star);
            setTimeout(() => star.remove(), 550);
        }
        paintNoteFill(idx, 1);
        markStaffNoteDone(idx);
        soloIdx++;
        updateStaffScroll();
    }

    function startHold(idx, key) {
        if (soloHold) return;
        drainSeq++;
        soloHold = { idx: idx, key: key, full: false, t0: Date.now(), need: songNotes[idx].dur * 1000 };
        const el = staffNoteEls[idx];
        if (el) el.classList.add('holding');
        holdTick();
    }

    function holdTick() {
        if (!soloHold) return;
        const p = Math.min(1, (Date.now() - soloHold.t0) / soloHold.need);
        paintNoteFill(soloHold.idx, p);
        if (p >= 1 && !soloHold.full) {
            soloHold.full = true;
            const el = staffNoteEls[soloHold.idx];
            if (el) el.classList.add('hold-full');
            holdChime();
        }
        soloHold.raf = requestAnimationFrame(holdTick);
    }

    function releaseHold(key) {
        if (!soloHold || soloHold.key !== key) return;
        const h = soloHold;
        soloHold = null;
        cancelAnimationFrame(h.raf);
        const el = staffNoteEls[h.idx];
        if (el) el.classList.remove('holding', 'hold-full');
        const p = Math.min(1, (Date.now() - h.t0) / h.need);
        if (p >= HOLD_TOL) completeSoloNote(h.idx, h.key);
        else drainNote(h.idx, p);
    }

    // שחרור מוקדם הוא לא טעות — המים פשוט נשפכים החוצה, ומנסים שוב.
    // שום דבר לא נספר לרעה ושום דבר לא מהבהב באדום.
    function drainNote(idx, from) {
        const t0 = Date.now();
        const mine = ++drainSeq;
        (function step() {
            if (mine !== drainSeq) return;
            const q = Math.min(1, (Date.now() - t0) / 280);
            paintNoteFill(idx, from * (1 - q));
            if (q < 1) requestAnimationFrame(step);
        })();
    }

    function cancelHold() {
        if (!soloHold) return;
        const h = soloHold;
        soloHold = null;
        cancelAnimationFrame(h.raf);
        const el = staffNoteEls[h.idx];
        if (el) el.classList.remove('holding', 'hold-full');
        paintNoteFill(h.idx, 0);
    }

    function markStaffNoteDone(index) {
        const el = staffNoteEls[index];
        if (el) el.classList.add('done');
    }

    function updateStaffScroll() {
        const cur = staffNoteEls[soloIdx];
        if (!cur) return;
        // scrollIntoView מבקש מהדפדפן "לחשוף" את האלמנט, ומשאיר לו לבחור
        // איך. ספארי באייפון בוחר לפעמים להגדיל את העמוד כולו - וזה קורה
        // מיד אחרי שתו נסגר, בלי שום מחווה של המשתמש, ולכן שום חסימת מגע
        // לא נגעה בזה. גוללים את החמשה בעצמנו: המכל בלבד, לא העמוד.
        const target = cur.offsetLeft - (staffWrap.clientWidth - cur.offsetWidth) / 2;
        const left = Math.max(0, Math.min(target, staffInner.offsetWidth - staffWrap.clientWidth));
        if (staffWrap.scrollTo) staffWrap.scrollTo({ left: left, behavior: 'smooth' });
        else staffWrap.scrollLeft = left;
    }

    soloBtn.addEventListener('click', () => {
        cancelHold();
        soloMode = !soloMode;
        soloBtn.classList.toggle('active', soloMode);
        soloBtn.textContent = soloMode ? 'חזרה לתרגול הרגיל' : 'אני רוצה לנסות לבד';
        noteLane.classList.toggle('hidden', soloMode);
        staffWrap.classList.toggle('active', soloMode);
        if (soloMode) {
            player.pauseVideo();
            isPaused = true;
            playPauseBtn.textContent = '▶';
            soloIdx = 0;
            staffNoteEls.forEach(el => el.classList.remove('done'));
            buildStaff();
            dismissPracticeHint();
            // Leftover state from the timed practice mode shouldn't carry
            // into a fresh "לנסות לבד" attempt.
            Object.values(keyByNote).forEach(el => el.classList.remove('due'));
            resetKeyFills();
            activeTiles.forEach(tile => tile.remove());
            activeTiles.clear();
        }
        sizeKeys();
    });

    (function fallLoop() {
        renderFallingLane(player.getCurrentTime());
        requestAnimationFrame(fallLoop);
    })();

    function sizeKeys() {
        const totalWhiteKeys = 7;
        const reserved = 40;
        const rawWidth = Math.min(pianoContainer.clientWidth, window.innerWidth);
        const containerWidth = Math.max(220, rawWidth - reserved);

        let whiteW = Math.floor(containerWidth / totalWhiteKeys);
        whiteW = Math.max(24, Math.min(whiteW, 100));

        // No 220px floor here on purpose — on a short landscape phone screen
        // that floor used to claim more height than actually exists,
        // pushing the piano/staff below the visible viewport instead of
        // shrinking to fit it.
        const availableH = Math.max(140, pianoContainer.clientHeight - 20);
        // Keys get first claim on the space and a real floor — a small
        // phone in landscape is exactly when keys most need to stay
        // tappable, so the lane (just for reading notes, not playing) is
        // what shrinks first, not the keyboard itself.
        const maxKeyH = Math.min(260, Math.max(125, availableH - 55));
        const idealLaneHForSizing = Math.max(55, Math.min(150, Math.round(whiteW * 2.1)));
        const laneH = Math.max(55, Math.min(idealLaneHForSizing, availableH - maxKeyH));

        let keyH = whiteW * 3.2;
        if (keyH > maxKeyH) {
            keyH = maxKeyH;
            whiteW = Math.max(24, Math.floor(keyH / 3.2));
        }

        const blackW = Math.round(whiteW * 0.495);

        document.documentElement.style.setProperty('--white-w', whiteW + 'px');
        document.documentElement.style.setProperty('--black-w', blackW + 'px');
        document.documentElement.style.setProperty('--key-h', keyH + 'px');
        document.documentElement.style.setProperty('--lane-h', laneH + 'px');
        // רצועת העיגולים היא התוכן המרכזי במצב "לנסות לבד", ולכן היא מקבלת
        // גובה משלה ולא יורשת את הפס הצר של מסלול התווים הנופלים.
        const staffH = Math.max(78, Math.min(116, availableH - keyH - 8));
        document.documentElement.style.setProperty('--staff-h', staffH + 'px');
    }
    window.addEventListener('resize', () => {
        sizeKeys();
        // בנייה מחדש בזמן שאצבע מחזיקה תו מוחקת את העיגול שמתחתיה
        if (soloMode && !soloHold) buildStaff();
    });
    sizeKeys();
    window.addEventListener('load', sizeKeys);
    requestAnimationFrame(sizeKeys);
    setTimeout(sizeKeys, 400);
    setTimeout(sizeKeys, 1200);

    // הניסוי נכנס ישר לחמשה. קודם המסך הראה את מסלול התווים הנופלים -
    // מסך מת, בלי שיר ובלי כפתורים - עד שנגעו בו. עכשיו אין רגע כזה.
    practiceHint.textContent = 'החזיקו את הקליד עד שהעיגול מתמלא 👇';
    soloBtn.click();
    // הארון עדיין לא נמדד בשלב הזה, אז בונים שוב כשהפריסה מתייצבת
    [0, 300, 900].forEach(ms => setTimeout(() => { if (soloMode && !soloHold) buildStaff(); }, ms));
    window.addEventListener('load', () => { if (soloMode && !soloHold) buildStaff(); });

    // ===================== שורת אבחון זמנית =====================
    // נוספה כדי לענות על שאלה אחת בלבד: כשהמסך גדל, מי גדל.
    //   scale = ההגדלה של ספארי עצמו. 1.00 פירושו שלא היה זום כלל.
    //   key   = רוחב הקליד שהקוד שלנו חישב.
    // אם scale קופץ מעל 1 — זה הדפדפן. אם key קופץ ו-scale נשאר 1.00 —
    // ההגדלה היא שלנו, מחישוב הפריסה, ולזום אין לזה שום קשר.
    const dbg = document.createElement("div");
    dbg.id = "dbg-bar";
    document.body.appendChild(dbg);
    let fingersNow = 0, fingersMax = 0, lastEvent = "start";
    const keyJumps = [];
    const readKeyW = () => Math.round(parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--white-w")) || 0);
    let lastKeyW = readKeyW();
    // רישום המגעים האחרונים. ברגע שההגדלה קורית הרישום קופא, כדי
    // שאפשר יהיה לקרוא בדיוק מה קדם לה: כמה אצבעות, ובאיזה מרווח.
    const touchLog = [];
    let zoomTrigger = "";
    document.addEventListener('touchstart', e => {
        touchLog.push({ t: Date.now(), n: e.touches.length });
        if (touchLog.length > 6) touchLog.shift();
    }, { passive: true });
    function checkZoom() {
        const vv = window.visualViewport;
        if (!vv || zoomTrigger || vv.scale <= 1.01) return;
        const now = Date.now();
        const seq = touchLog.map((x, i) => (i ? "+" + (x.t - touchLog[i - 1].t) + "ms " : "") + x.n + "f").join(" ");
        const since = touchLog.length ? (now - touchLog[touchLog.length - 1].t) + "ms" : "-";
        zoomTrigger = "x" + vv.scale.toFixed(2) + " after " + since + " | " + (seq || "no touches");
    }
    // נמדדים פעם אחת בטעינה, ומשמשים כנקודת ההשוואה.
    const dpr0 = window.devicePixelRatio;
    const keyW0 = readKeyW();
    // הגדלת Aa של ספארי משנה את devicePixelRatio אבל אף פעם לא את
    // visualViewport.scale. צביטה עושה בדיוק ההפך. זה מפריד ביניהן.
    function verdictText() {
        const vv = window.visualViewport;
        if (vv && vv.scale > 1.01) return "צביטה של ספארי";
        if (Math.abs(window.devicePixelRatio - dpr0) > 0.01) return "הגדלת Aa של ספארי";
        if (readKeyW() !== keyW0) return "חישוב הפריסה שלנו";
        return "תקין";
    }
    function paintDbg(ev) {
        if (ev) lastEvent = ev;
        const vv = window.visualViewport;
        const kw = readKeyW();
        checkZoom();
        if (kw !== lastKeyW) {
            keyJumps.push(lastKeyW + "->" + kw + " @" + lastEvent);
            if (keyJumps.length > 3) keyJumps.shift();
            lastKeyW = kw;
        }
        const v = verdictText();
        const verd = document.createElement("span");
        verd.id = "dbg-verdict";
        if (v !== "תקין") verd.className = "bad";
        verd.textContent = "מצב: " + v;
        const big = document.createElement("span");
        big.id = "dbg-big";
        big.textContent = "SCALE " + (vv ? vv.scale.toFixed(2) : "-") + "  KEY " + kw + "/" + keyW0 +
            "  DPR " + window.devicePixelRatio.toFixed(2) + "/" + dpr0.toFixed(2);
        dbg.textContent = "";
        dbg.appendChild(verd);
        dbg.appendChild(big);
        dbg.appendChild(document.createTextNode(
            "win " + innerWidth + "x" + innerHeight +
            "  vv " + (vv ? Math.round(vv.width) + "x" + Math.round(vv.height) : "-") +
            "  pc " + Math.round(pianoContainer.clientWidth) +
            "  fing " + fingersNow + "/" + fingersMax +
            "\nlast: " + lastEvent +
            (keyJumps.length ? "\njumps: " + keyJumps.join("  ") : "")));
        if (zoomTrigger) {
            const trg = document.createElement("span");
            trg.id = "dbg-trigger";
            trg.textContent = "TRIGGER " + zoomTrigger;
            dbg.appendChild(trg);
        }
        placeDbg();
    }

    // הפס נצמד לחלון הנראה בפועל. בלי זה, ברגע שספארי מגדיל, תחתית
    // העמוד יוצאת מהמסך והפס נעלם - בדיוק ברגע שצריך לקרוא אותו.
    function placeDbg() {
        const vv = window.visualViewport;
        if (!vv) { dbg.style.left = "0px"; dbg.style.width = "100%"; dbg.style.top = (innerHeight - dbg.offsetHeight) + "px"; return; }
        dbg.style.left = vv.offsetLeft + "px";
        dbg.style.width = vv.width + "px";
        dbg.style.top = (vv.offsetTop + vv.height - dbg.offsetHeight) + "px";
    }
    ["resize", "orientationchange"].forEach(t => window.addEventListener(t, () => paintDbg(t)));
    if (window.visualViewport) {
        ["resize", "scroll"].forEach(t => window.visualViewport.addEventListener(t, () => paintDbg("vv-" + t)));
    }
    document.addEventListener("touchstart", e => {
        fingersNow = e.touches.length;
        fingersMax = Math.max(fingersMax, fingersNow);
        paintDbg("touchstart x" + fingersNow);
    }, { passive: true });
    document.addEventListener("touchend", e => { fingersNow = e.touches.length; paintDbg("touchend"); }, { passive: true });
    setInterval(() => paintDbg(), 400);
    paintDbg("start");
    // =================== סוף שורת האבחון ===================

    setInterval(() => {
        // This loop drives the timed-practice due-highlight/songIdx off the
        // (possibly paused) player clock — without this guard it kept
        // running under "לנסות לבד" too, and since pausing freezes time
        // rather than stopping the interval, it would re-apply a stale
        // "due" highlight moments after solo mode had just cleared it.
        if (soloMode) return;
        if (songIdx >= songNotes.length) return;
        const t = player.getCurrentTime();
        const cur = songNotes[songIdx];
        const keyEl = keyByNote[cur.note];
        const inWindow = t >= cur.time - NOTE_LEAD && t <= cur.time + NOTE_TAIL;

        if (keyEl) keyEl.classList.toggle('due', inWindow);

        if (t > cur.time + NOTE_TAIL) {
            if (keyEl) keyEl.classList.remove('due');
            songIdx++;
            songHit = false;
        }
    }, 100);
</script>
</body>
</html>
